name: ios-unsigned-ipa

on:
  push:
    branches: [ci/ios-unsigned-ipa]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Toolchain
        run: |
          xcodebuild -version
          xcode-select -p
          pod --version
          node --version

      - name: Install dependencies
        run: npm run setup

      - name: Prebuild iOS project
        working-directory: apps/mobile
        run: npx expo prebuild -p ios --no-install

      - name: Pod install
        working-directory: apps/mobile/ios
        run: |
          ls -la
          pod install

      - name: Archive (unsigned)
        working-directory: apps/mobile/ios
        run: |
          set -euo pipefail
          WORKSPACE=$(ls -d *.xcworkspace | head -n1)
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list -json 2>/dev/null \
            | python3 -c 'import json,sys; s=json.load(sys.stdin)["workspace"]["schemes"]; c=[x for x in s if not x.startswith("Pods-")]; print(c[0])')
          echo "workspace=$WORKSPACE scheme=$SCHEME"
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/DSBotMobile.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" CODE_SIGN_ENTITLEMENTS="" \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            ONLY_ACTIVE_ARCH=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            archive

      - name: Package unsigned ipa
        run: |
          set -euo pipefail
          APP=$(find apps/mobile/ios/build/DSBotMobile.xcarchive/Products/Applications -maxdepth 1 -name '*.app' | head -n1)
          echo "app=$APP"
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out
          zip -qry ../ds-bot-mobile-app-unsigned.ipa Payload
          ls -lh ../ds-bot-mobile-app-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ds-bot-mobile-app-unsigned-ipa
          path: ds-bot-mobile-app-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
